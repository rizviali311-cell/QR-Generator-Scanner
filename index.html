<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator & Scanner - Create & Read Instantly</title>
    <meta name="description" content="Professional QR Toolkit for generating custom QR codes and scanning them using your camera. Includes history and download features.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QR Generate Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- QR Scan Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md glass-card rounded-3xl p-6 shadow-2xl border border-gray-700/50">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-400 mb-3 shadow-lg shadow-blue-500/30">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4m-4 0H8m4 0v4m0-4V8m0 4h4m-4 0H8"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">QR Generator & Scanner</h1>
            <p class="text-gray-400 text-sm mt-1">Generate & Scan Instantly</p>
        </div>

        <!-- Tabs -->
        <div class="flex bg-gray-800/80 backdrop-blur rounded-xl p-1 mb-6 border border-gray-700/50">
            <button onclick="switchTab('generate')" id="tab-generate" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-blue-600 text-white shadow-lg shadow-blue-600/25">
                Generate
            </button>
            <button onclick="switchTab('scan')" id="tab-scan" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-gray-400 hover:text-white">
                Scan
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-gray-400 hover:text-white">
                History
            </button>
        </div>

        <!-- ================= GENERATE TAB ================= -->
        <div id="generate-panel" class="tab-panel">
            <label class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-2 block">Enter Text or URL</label>
            <textarea id="qr-text" rows="3" placeholder="Type something..." 
                class="w-full bg-gray-900/60 border border-gray-700 rounded-xl p-3.5 text-white placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 transition resize-none text-sm"></textarea>
            
            <div class="grid grid-cols-2 gap-3 mt-4">
                <div>
                    <label class="text-xs text-gray-500 mb-1.5 block">Size</label>
                    <select id="qr-size" class="w-full bg-gray-900/60 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="150">Small (150px)</option>
                        <option value="200" selected>Medium (200px)</option>
                        <option value="300">Large (300px)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-500 mb-1.5 block">Color</label>
                    <div class="flex items-center bg-gray-900/60 border border-gray-700 rounded-lg p-1.5 h-[46px]">
                        <input type="color" id="qr-color" value="#0ea5e9" class="w-full h-full bg-transparent cursor-pointer border-none">
                    </div>
                </div>
            </div>

            <button onclick="generateQR()" 
                class="w-full mt-5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-semibold py-3.5 rounded-xl transition-all duration-200 transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                Generate QR Code
            </button>

            <!-- Result Area -->
            <div id="qr-result" class="hidden mt-6">
                <div class="bg-white rounded-2xl p-5 shadow-xl flex justify-center relative group">
                    <div id="qrcode"></div>
                    <div class="absolute inset-0 bg-blue-500/5 rounded-2xl opacity-0 group-hover:opacity-100 transition pointer-events-none"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-3 mt-4">
                    <button onclick="downloadQR()" class="flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white py-2.5 rounded-xl text-sm font-medium transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download
                    </button>
                    <button onclick="shareQR()" class="flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white py-2.5 rounded-xl text-sm font-medium transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                        Share
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= SCAN TAB ================= -->
        <div id="scan-panel" class="tab-panel hidden">
            <div class="relative bg-black rounded-2xl overflow-hidden border border-gray-700 shadow-inner">
                <div id="reader" class="w-full h-64 flex items-center justify-center text-gray-500 text-sm bg-gray-900/50">
                    <div class="text-center p-6">
                        <svg class="w-10 h-10 mx-auto mb-2 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <p>Camera preview will appear here</p>
                    </div>
                </div>
                
                <!-- Scanner Overlay -->
                <div id="scan-overlay" class="absolute inset-0 pointer-events-none hidden">
                    <div class="absolute inset-0 border-[3px] border-blue-400/30 rounded-2xl"></div>
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-56 h-56 border-2 border-blue-400/60 rounded-lg">
                        <div class="absolute top-0 left-0 w-4 h-4 border-t-4 border-l-4 border-blue-500 -mt-1 -ml-1"></div>
                        <div class="absolute top-0 right-0 w-4 h-4 border-t-4 border-r-4 border-blue-500 -mt-1 -mr-1"></div>
                        <div class="absolute bottom-0 left-0 w-4 h-4 border-b-4 border-l-4 border-blue-500 -mb-1 -ml-1"></div>
                        <div class="absolute bottom-0 right-0 w-4 h-4 border-b-4 border-r-4 border-blue-500 -mb-1 -mr-1"></div>
                    </div>
                    <div class="absolute top-0 left-0 w-full h-0.5 bg-blue-400 shadow-[0_0_15px_rgba(96,165,250,0.8)] animate-scan"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-4">
                <button onclick="startScan()" id="start-btn" class="flex items-center justify-center gap-2 bg-green-600 hover:bg-green-500 text-white py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-green-600/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Start Camera
                </button>
                <button onclick="stopScan()" id="stop-btn" class="hidden flex items-center justify-center gap-2 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-red-600/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                    Stop
                </button>
            </div>

            <!-- Scan Result -->
            <div id="scan-result" class="hidden mt-4 bg-gray-800/60 backdrop-blur rounded-xl p-4 border border-gray-700">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Scanned Result</p>
                    <span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full font-medium">Success</span>
                </div>
                <p id="scanned-text" class="text-white font-mono text-sm break-all mb-3 bg-gray-900/50 p-2.5 rounded-lg border border-gray-700/50"></p>
                
                <!-- Visual Search Result -->
                <div id="visual-result" class="hidden mb-4 animate-fade-in">
                    <div class="relative rounded-xl overflow-hidden aspect-video bg-gray-900 mb-2 group cursor-zoom-in" onclick="viewHighRes()">
                        <img id="visual-img" src="" alt="Result" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-3">
                            <p id="visual-title" class="text-white text-xs font-bold"></p>
                        </div>
                        <div class="absolute top-2 right-2 bg-black/50 backdrop-blur-sm p-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                        </div>
                    </div>
                    <p id="visual-desc" class="text-gray-400 text-[11px] leading-relaxed line-clamp-3 mb-3"></p>
                    <button id="wiki-link" onclick="openWiki()" class="w-full py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-[10px] text-gray-300 font-medium transition flex items-center justify-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.09 4.45c-1.12 0-2.34.24-3.53.59-.44.13-.8.47-1.02.88L3.25 14.1c-.13.25-.13.55 0 .8.13.25.37.42.66.42h1.56c.28 0 .54-.15.68-.4l.84-1.52h6.14l.84 1.52c.14.25.4.4.68.4h1.56c.29 0 .53-.17.66-.42.13-.25.13-.55 0-.8l-4.29-8.18c-.22-.41-.58-.75-1.02-.88-1.19-.35-2.41-.59-3.53-.59zm0 1.63c.69 0 1.4.15 2.11.36l3.3 6.3h-10.82l3.3-6.3c.71-.21 1.42-.36 2.11-.36z"/></svg>
                        Explore More on Wikipedia
                    </button>
                </div>

                <!-- Loading Visual -->
                <div id="visual-loading" class="hidden py-4 text-center">
                    <div class="inline-block w-5 h-5 border-2 border-blue-500/30 border-t-blue-500 rounded-full animate-spin"></div>
                    <p class="text-[10px] text-gray-500 mt-2">Fetching visual data...</p>
                </div>

                <div class="flex gap-2">
                    <button onclick="copyResult()" class="flex-1 bg-blue-600/15 text-blue-400 hover:bg-blue-600/25 border border-blue-500/20 py-2 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copy
                    </button>
                    <button onclick="openResult()" id="open-btn" class="hidden flex-1 bg-green-600/15 text-green-400 hover:bg-green-600/25 border border-green-500/20 py-2 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        Open Link
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= HISTORY TAB ================= -->
        <div id="history-panel" class="tab-panel hidden">
            <div id="history-list" class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                <div class="text-center py-10">
                    <div class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg class="w-8 h-8 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <p class="text-gray-500 text-sm">No history yet</p>
                </div>
            </div>
            <button onclick="clearHistory()" class="w-full mt-5 text-red-400/80 hover:text-red-400 text-xs font-medium py-2 transition flex items-center justify-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Clear All History
            </button>
        </div>

    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl border border-gray-700 text-sm font-medium opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center gap-2">
        <span class="w-2 h-2 bg-green-400 rounded-full shadow-[0_0_8px_rgba(74,222,128,0.6)]"></span>
        <span id="toast-msg">Message</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
